<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Equation Image</title>
    <style>
      body {
        margin: 0;
        padding: 32px 16px;
        background: #f8fafc;
        font-family: Arial, sans-serif;
        color: #111827;
      }
      .container {
        max-width: 980px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }
      p {
        margin: 0 0 20px;
        color: #374151;
      }
      .gallery {
        display: grid;
        gap: 16px;
      }
      figure {
        margin: 0;
        background: #ffffff;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        padding: 12px;
      }
      img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 8px;
      }
      figcaption {
        margin-top: 10px;
        font-size: 14px;
        color: #4b5563;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>แกลเลอรีสมการระดับโลก</h1>
      <p>
        รวมครบ 6 รูปที่คุณส่งมาแล้วครับ พร้อมคำอธิบายสั้น ๆ ใต้ภาพแต่ละสมการ
      </p>
      <section class="gallery" aria-label="Equation image gallery">
        <figure>
          <img src="https://github.com/user-attachments/assets/e630a46b-ab3b-405e-9b14-4937d490a6b5" alt="สมการฟิสิกส์เชิงเกจในรูปแบบ Wilson loop" />
          <figcaption>ภาพที่ 1: สมการเชิงฟิสิกส์พลังสูงที่สื่อถึงโครงสร้างและสมมาตรเชิงลึกของธรรมชาติ</figcaption>
        </figure>
        <figure>
          <img src="https://github.com/user-attachments/assets/427cfc76-4cbf-4d03-a2dd-9dcda588b4c5" alt="สมการระดับโลกภาพที่สอง" />
          <figcaption>ภาพที่ 2: สมการคลาสสิกที่โดดเด่นด้านความสวยงามและพลังในการอธิบายปรากฏการณ์จริง</figcaption>
        </figure>
        <figure>
          <img src="https://github.com/user-attachments/assets/055dc758-551d-4926-ba63-cb43123efaa2" alt="สมการระดับโลกภาพที่สาม" />
          <figcaption>ภาพที่ 3: สมการสำคัญที่สะท้อนความเชื่อมโยงระหว่างแนวคิดคณิตศาสตร์และโลกฟิสิกส์</figcaption>
        </figure>
        <figure>
          <img src="https://github.com/user-attachments/assets/0006646f-14b2-49a4-8dea-f8054ee8cba3" alt="สมการระดับโลกภาพที่สี่" />
          <figcaption>ภาพที่ 4: สมการที่เน้นโครงสร้างเชิงไม่เชิงเส้นและการไหลของระบบซับซ้อน</figcaption>
        </figure>
        <figure>
          <img src="https://github.com/user-attachments/assets/0b562b2b-2228-4185-a90a-29b8427a36e4" alt="สมการระดับโลกภาพที่ห้า" />
          <figcaption>ภาพที่ 5: สมการสำหรับวิเคราะห์การคงอยู่ของข้อมูลภายใต้ข้อจำกัดทางฟิสิกส์</figcaption>
        </figure>
        <figure>
          <img src="https://github.com/user-attachments/assets/c6d8dd44-b09b-46dd-a69a-6e7460fd76c2" alt="สมการระดับโลกภาพที่หก" />
          <figcaption>ภาพที่ 6: สมการสรุปภาพรวมของกรอบทฤษฎีที่เชื่อมแนวคิดทั้งหมดเข้าด้วยกัน</figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
